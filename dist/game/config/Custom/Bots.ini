# ---------------------------------------------------------------------------
# Bot Orchestrator Configuration
# ---------------------------------------------------------------------------

# Enable the bot system
EnableBots = True

# Maximum number of bots online simultaneously
MaxBotsOnline = 4

# How many bots to spawn per batch
BotsSpawnBatchSize = 2

# Initial delay before the first bot spawn after server start (seconds)
BotsInitialDelaySeconds = 60

# Interval between spawn batches (seconds)
BotsSpawnIntervalSeconds = 15

# Percentage of ACTIVE bots (farmers). Rest are PASSIVE (ambient city walkers).
# Example: 30 means 30% ACTIVE, 70% PASSIVE
BotActivePercent = 50

# How long (seconds) a bot idles in the city after buying supplies.
# Randomised between min and max each time. Set both to 60 for quick testing.
BotCityIdleMinSeconds = 30
BotCityIdleMaxSeconds = 60

# How long (seconds) the bot waits at the gatekeeper before teleporting to farm.
# Simulates a human choosing a destination and confirming the gate.
BotGateWaitMinSeconds = 5
BotGateWaitMaxSeconds = 10

# XP multiplier for bots (0.0 = no XP, 1.0 = full XP)
# Keep low to avoid bots influencing economy
BotXpMultiplier = 1.0

# Drop chance multiplier for bots (0.0 = no drops, 1.0 = full drops)
BotDropMultiplier = 1.0

# ---------------------------------------------------------------------------
# Behaviour session durations
# ---------------------------------------------------------------------------

# How long (minutes) a bot farms in PvE before heading to city to restock.
BotPveSessionMinutes = 10

# How long (minutes) a bot stays in city (idle/restock) before returning to farm.
BotCitySessionMinutes = 5

# How long (minutes) a PASSIVE bot keeps its private shop open.
BotShopSessionMinutes = 5

# Language for bot chat phrases: en, ru, pl
BotsLanguage = en
