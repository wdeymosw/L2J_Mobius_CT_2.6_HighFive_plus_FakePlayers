# ---------------------------------------------------------------------------
# Bot Orchestrator Configuration
# ---------------------------------------------------------------------------

# Enable the bot system
EnableBots = True

# Maximum number of bots online simultaneously
MaxBotsOnline = 50

# How many bots to spawn per batch
BotsSpawnBatchSize = 3

# Interval between spawn batches (seconds)
BotsSpawnIntervalSeconds = 5

# Percentage of CORE bots (farmers). Rest are NOISE (ambient).
# Example: 30 means 30% CORE, 70% NOISE
BotCorePercent = 30

# XP multiplier for bots (0.0 = no XP, 1.0 = full XP)
# Keep low to avoid bots influencing economy
BotXpMultiplier = 0.1

# Drop chance multiplier for bots (0.0 = no drops, 1.0 = full drops)
BotDropMultiplier = 0.1
